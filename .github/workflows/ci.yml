name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. force-push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Olorin's build.rs locates the Ea compiler via `which ea`; the steps
  # below ensure `ea` is on PATH before `cargo build` runs.

jobs:
  build-test:
    name: Build + test (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Olorin
        uses: actions/checkout@v6

      - name: Install eacompute system deps (LLVM 18)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev clang-18 libpolly-18-dev libzstd-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout eacompute (sibling repo)
        uses: actions/checkout@v6
        with:
          repository: petlukk/eacompute
          path: eacompute
          ref: main

      - name: Cache eacompute build
        uses: actions/cache@v5
        with:
          path: eacompute/target
          key: eacompute-${{ runner.os }}-${{ hashFiles('eacompute/Cargo.lock', 'eacompute/Cargo.toml', 'eacompute/build.rs') }}-${{ hashFiles('eacompute/src/**') }}

      - name: Build eacompute (release)
        working-directory: eacompute
        run: cargo build --release --features=llvm

      - name: Add ea to PATH
        run: echo "${GITHUB_WORKSPACE}/eacompute/target/release" >> "$GITHUB_PATH"

      - name: Verify ea on PATH
        run: |
          which ea
          ea --version || true

      - name: Cache Olorin cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: olorin-v1
          shared-key: linux-x86_64

      - name: Build Olorin (release)
        run: cargo build --release

      - name: Run tests (release)
        # `--release` matches the build profile we just compiled, avoiding
        # a second full rebuild for the test binaries. If specific tests
        # prove flaky on the runner, filter with `--skip <name>` here.
        run: cargo test --release --no-fail-fast

  build-windows-cross:
    # Cross-compile Olorin's Windows binary from Ubuntu via MinGW-w64.
    # Matches Peter's local dev flow (.cargo/config.toml's
    # x86_64-pc-windows-gnu stanza) and routes through eacompute's
    # MinGW cross-link path (lib.rs:219), which statically links
    # MinGW's libc — so expf et al. resolve without an MSVC runtime.
    # Tests run as part of the regular Linux job; this job only
    # verifies the cross-build produces olorin.exe.
    name: Cross-build Windows x86_64 (MinGW)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Olorin
        uses: actions/checkout@v6

      - name: Install eacompute system deps + MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev clang-18 libpolly-18-dev libzstd-dev \
            mingw-w64

      - name: Install Rust toolchain (stable) with Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Checkout eacompute (sibling repo)
        uses: actions/checkout@v6
        with:
          repository: petlukk/eacompute
          path: eacompute
          ref: main

      - name: Cache eacompute build
        uses: actions/cache@v5
        with:
          path: eacompute/target
          key: eacompute-${{ runner.os }}-${{ hashFiles('eacompute/Cargo.lock', 'eacompute/Cargo.toml', 'eacompute/build.rs') }}-${{ hashFiles('eacompute/src/**') }}

      - name: Build eacompute (release)
        working-directory: eacompute
        run: cargo build --release --features=llvm

      - name: Add ea to PATH
        run: echo "${GITHUB_WORKSPACE}/eacompute/target/release" >> "$GITHUB_PATH"

      - name: Cache Olorin cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: olorin-v1
          shared-key: windows-x86_64-cross

      - name: Build Olorin (release, cross to Windows)
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Verify olorin.exe exists
        run: |
          test -f target/x86_64-pc-windows-gnu/release/olorin.exe
          file target/x86_64-pc-windows-gnu/release/olorin.exe
