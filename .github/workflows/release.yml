name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the release to (must already exist)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Windows-only — eacompute's llvm-sys-181 needs a real LLVM 18 dev
  # distribution (headers + .libs + llvm-config.exe), not the binaries-
  # only chocolatey package.  Mirrors petlukk/eacompute's own workflow.
  LLVM_VERSION: "18.1.8"
  LLVM_SYS_181_PREFIX: C:\llvm

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            ext: ''
            os_family: linux
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            ext: ''
            os_family: linux
          - target: windows-x86_64
            runner: windows-latest
            ext: '.exe'
            os_family: windows

    steps:
      - name: Checkout Olorin
        uses: actions/checkout@v4

      # --- eacompute (Ea compiler, required to build SIMD kernels) -----

      - name: Install eacompute system deps (Linux, LLVM 18)
        if: matrix.os_family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev clang-18 libpolly-18-dev libzstd-dev

      # Windows LLVM setup — mirrors petlukk/eacompute's workflow exactly.
      # Chocolatey LLVM is binaries-only; llvm-sys needs headers + .libs
      # + llvm-config.exe, which only the official tarball ships.
      - name: Download and extract LLVM 18 (Windows)
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile llvm.tar.xz -MaximumRetryCount 3 -RetryIntervalSec 10
          7z x llvm.tar.xz
          7z x llvm.tar
          Move-Item "clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc" C:\llvm

      - name: Set up MSVC dev environment (Windows)
        if: matrix.os_family == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # `llvm-config --system-libs` lists libxml2 and zstd on the MSVC
      # tarball even when LLVM itself doesn't pull them — stub both with
      # empty archives so the llvm-sys link step finds them.
      - name: Create stub libs for LLVM link dependencies (Windows)
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: |
          Set-Content -Path empty.c -Value "// stub"
          cl /c /nologo empty.c
          lib /NOLOGO /OUT:C:\llvm\lib\libxml2s.lib /MACHINE:X64 empty.obj
          lib /NOLOGO /OUT:C:\llvm\lib\zstd.lib /MACHINE:X64 empty.obj

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout eacompute (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: petlukk/eacompute
          path: eacompute
          ref: main

      - name: Cache eacompute build
        uses: actions/cache@v4
        with:
          path: eacompute/target
          key: eacompute-${{ matrix.target }}-${{ hashFiles('eacompute/Cargo.lock', 'eacompute/Cargo.toml', 'eacompute/build.rs') }}-${{ hashFiles('eacompute/src/**') }}

      - name: Build eacompute (release)
        working-directory: eacompute
        run: cargo build --release --features=llvm

      - name: Add ea to PATH (Linux)
        if: matrix.os_family == 'linux'
        run: echo "${GITHUB_WORKSPACE}/eacompute/target/release" >> "$GITHUB_PATH"

      - name: Add ea to PATH (Windows)
        if: matrix.os_family == 'windows'
        run: |
          "$env:GITHUB_WORKSPACE\eacompute\target\release" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      # --- Olorin binary ------------------------------------------------

      - name: Cache Olorin cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: olorin-release-v1
          shared-key: ${{ matrix.target }}

      - name: Build Olorin (release)
        # Wrap pidfd_spawnp / pidfd_getpid on Linux so the binary loads on
        # older glibc (e.g. Debian 12 Bookworm, glibc 2.36) — the runners
        # ship glibc 2.39 and without the wrap the resulting binary
        # demands `GLIBC_2.39` at runtime.  Olorin's exec module already
        # provides the fallback impls these wraps redirect to.
        env:
          RUSTFLAGS: ${{ matrix.os_family == 'linux' && '-C link-args=-Wl,--wrap=pidfd_spawnp -C link-args=-Wl,--wrap=pidfd_getpid' || '' }}
        run: cargo build --release

      - name: Stage olorin binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT:    ${{ matrix.ext }}
        run: |
          mkdir -p dist
          cp "target/release/olorin${EXT}" "dist/olorin-${TARGET}${EXT}"

      # --- WhatsApp bridge (Go) -----------------------------------------
      # Windows is skipped here: the bridge currently uses mattn/go-sqlite3
      # which is CGo-only and needs a working MinGW on the build host.
      # A pure-Go sqlite swap (modernc.org/sqlite) lands in a follow-up;
      # for now Windows users get olorin.exe without wa-bridge.exe.

      - name: Set up Go
        if: matrix.os_family != 'windows'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build wa-bridge (release, stripped)
        if: matrix.os_family != 'windows'
        working-directory: bridge
        shell: bash
        env:
          CGO_ENABLED: '1'
          TARGET: ${{ matrix.target }}
          EXT:    ${{ matrix.ext }}
        run: |
          go build -trimpath -ldflags='-s -w' -o "../dist/wa-bridge-${TARGET}${EXT}" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: olorin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "${DISPATCH_TAG}" ]; then
            tag="${DISPATCH_TAG}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Reject anything not matching vX.Y.Z to fail fast if the input
          # is malformed (defence in depth — also limits what we feed to
          # action-gh-release).
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Refusing unexpected tag: $tag" >&2; exit 1 ;;
          esac
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
