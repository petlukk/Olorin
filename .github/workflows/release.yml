name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the release to (must already exist)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            ext: ''
            os_family: linux
            rust_target: ''
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            ext: ''
            os_family: linux
            rust_target: ''
          # Cross-compile Windows from Ubuntu via MinGW-w64. eacompute's
          # native-Windows linker passes /NODEFAULTLIB which leaves expf
          # unresolved; its MinGW cross path (lib.rs:219) statically links
          # MinGW's libc, so expf/fmaf/__extendhfsf2 all resolve cleanly.
          - target: windows-x86_64
            runner: ubuntu-24.04
            ext: '.exe'
            os_family: windows
            rust_target: x86_64-pc-windows-gnu

    steps:
      - name: Checkout Olorin
        uses: actions/checkout@v6

      # --- eacompute (Ea compiler, required to build SIMD kernels) -----

      - name: Install eacompute system deps (LLVM 18)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev clang-18 libpolly-18-dev libzstd-dev

      - name: Install MinGW-w64 (Windows cross)
        if: matrix.os_family == 'windows'
        run: sudo apt-get install -y mingw-w64

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Checkout eacompute (sibling repo)
        uses: actions/checkout@v6
        with:
          repository: petlukk/eacompute
          path: eacompute
          ref: main

      - name: Cache eacompute build
        uses: actions/cache@v5
        with:
          path: eacompute/target
          key: eacompute-${{ matrix.target }}-${{ hashFiles('eacompute/Cargo.lock', 'eacompute/Cargo.toml', 'eacompute/build.rs') }}-${{ hashFiles('eacompute/src/**') }}

      - name: Build eacompute (release)
        working-directory: eacompute
        run: cargo build --release --features=llvm

      - name: Add ea to PATH
        run: echo "${GITHUB_WORKSPACE}/eacompute/target/release" >> "$GITHUB_PATH"

      # --- Olorin binary ------------------------------------------------

      - name: Cache Olorin cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: olorin-release-v1
          shared-key: ${{ matrix.target }}

      - name: Build Olorin (release)
        # Wrap pidfd_spawnp / pidfd_getpid on Linux so the binary loads on
        # older glibc (e.g. Debian 12 Bookworm, glibc 2.36) — the runners
        # ship glibc 2.39 and without the wrap the resulting binary
        # demands `GLIBC_2.39` at runtime.  Olorin's exec module already
        # provides the fallback impls these wraps redirect to.
        env:
          RUSTFLAGS: ${{ matrix.os_family == 'linux' && '-C link-args=-Wl,--wrap=pidfd_spawnp -C link-args=-Wl,--wrap=pidfd_getpid' || '' }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          if [ -n "$RUST_TARGET" ]; then
            cargo build --release --target "$RUST_TARGET"
          else
            cargo build --release
          fi

      - name: Stage olorin binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT:    ${{ matrix.ext }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          mkdir -p dist
          if [ -n "$RUST_TARGET" ]; then
            src="target/$RUST_TARGET/release/olorin${EXT}"
          else
            src="target/release/olorin${EXT}"
          fi
          cp "$src" "dist/olorin-${TARGET}${EXT}"

      # --- WhatsApp bridge (Go) -----------------------------------------
      # Windows is skipped here: the bridge currently uses mattn/go-sqlite3
      # which is CGo-only and needs a working MinGW on the build host.
      # A pure-Go sqlite swap (modernc.org/sqlite) lands in a follow-up;
      # for now Windows users get olorin.exe without wa-bridge.exe.

      - name: Set up Go
        if: matrix.os_family != 'windows'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: bridge/go.sum

      - name: Build wa-bridge (release, stripped)
        if: matrix.os_family != 'windows'
        working-directory: bridge
        shell: bash
        env:
          CGO_ENABLED: '1'
          TARGET: ${{ matrix.target }}
          EXT:    ${{ matrix.ext }}
        run: |
          go build -trimpath -ldflags='-s -w' -o "../dist/wa-bridge-${TARGET}${EXT}" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: olorin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten and checksum
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "${DISPATCH_TAG}" ]; then
            tag="${DISPATCH_TAG}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Reject anything not matching vX.Y.Z to fail fast if the input
          # is malformed (defence in depth — also limits what we feed to
          # action-gh-release).
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Refusing unexpected tag: $tag" >&2; exit 1 ;;
          esac
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
