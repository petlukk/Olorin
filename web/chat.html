<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olorin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--crust:#11111b;--mantle:#181825;--base:#1e1e2e;--surface0:#313244;--surface1:#45475a;
--overlay0:#6c7086;--text:#cdd6f4;--subtext0:#a6adc8;--subtext1:#bac2de;
--lavender:#b4befe;--teal:#94e2d5;--green:#a6e3a1;--yellow:#f9e2af;
--peach:#fab387;--red:#f38ba8;--mauve:#cba6f7;--blue:#89b4fa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--crust);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hyprbar{height:32px;background:var(--mantle);border-bottom:1px solid var(--surface0);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:12px/32px 'JetBrains Mono',monospace;color:var(--subtext0);user-select:none}
.hyprbar .left,.hyprbar .right{display:flex;align-items:center;gap:14px}
.hyprbar .sep{color:var(--surface1)}
.tile-container{flex:1;display:grid;gap:2px;background:var(--crust);overflow:hidden}
.tile{display:flex;flex-direction:column;background:var(--base);border-radius:4px;overflow:hidden}
.tile.focused{box-shadow:0 0 0 2px var(--lavender)}
.tile-header{height:28px;background:var(--mantle);font:11px/28px 'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--subtext0)}
.c-lavender{color:var(--lavender)}.c-teal{color:var(--teal)}.c-green{color:var(--green)}
.c-yellow{color:var(--yellow)}.c-peach{color:var(--peach)}.c-red{color:var(--red)}
.c-mauve{color:var(--mauve)}.c-blue{color:var(--blue)}.c-text{color:var(--text)}.c-subtext1{color:var(--subtext1)}
.tile-close{background:none;border:none;color:var(--overlay0);cursor:pointer;font:14px monospace;padding:0 2px}
.tile-close:hover{color:var(--red)}
.chat-body{display:flex;flex-direction:column;gap:24px;font-family:'Inter',system-ui,sans-serif;overflow-y:auto;padding:24px 20px;flex:1;min-height:0}
.chat-msg{display:flex;gap:14px}
.chat-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 14px 'JetBrains Mono',monospace;flex-shrink:0}
.chat-avatar.user{background:var(--surface1);color:var(--lavender)}
.chat-avatar.assistant{background:var(--teal);color:var(--crust)}
.chat-sender{font-size:13px;font-weight:600;color:var(--subtext1);margin-bottom:6px}
.chat-sender.assistant{color:var(--teal)}
.chat-bubble{font-size:14px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-wrap:break-word}
.chat-input-area{padding:16px 20px;border-top:1px solid var(--surface0);background:var(--mantle)}
.chat-input-box{display:flex;align-items:center;background:var(--base);border:1px solid var(--surface1);border-radius:12px;padding:10px 16px}
.chat-input-box:focus-within{border-color:var(--lavender)}
.chat-input{flex:1;background:transparent;border:none;color:var(--text);font:14px 'Inter',system-ui,sans-serif;outline:none}
.chat-send{background:var(--lavender);color:var(--crust);border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px}
.cursor-blink{display:inline-block;width:2px;height:16px;background:var(--teal);vertical-align:text-bottom;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.repl-body{flex:1;overflow-y:auto;padding:12px;font:13px/1.6 'JetBrains Mono',monospace;min-height:0}
.repl-line{margin-bottom:4px}
.repl-prompt{color:var(--mauve)}
.repl-output{color:var(--subtext1);padding-left:16px}
.repl-success{color:var(--green)}
.repl-muted{color:var(--overlay0)}
.repl-input-line{display:flex;align-items:center;padding:8px 12px;border-top:1px solid var(--surface0);background:var(--mantle);font:13px 'JetBrains Mono',monospace}
.repl-input{flex:1;background:transparent;border:none;color:var(--text);font:13px 'JetBrains Mono',monospace;outline:none;padding:0}
.repl-cursor{display:inline-block;width:7px;height:15px;background:var(--mauve);animation:blink 1s step-end infinite;vertical-align:text-bottom}
.term-canvas{flex:1;min-height:0;display:block;background:var(--base);image-rendering:pixelated}
</style></head><body>
<div class="hyprbar">
<div class="left">
<span><span class="c-mauve">&#9670;</span> <span id="hb-model" class="c-text">—</span></span>
<span class="sep">|</span>
<span id="hb-backend" class="c-blue">—</span>
<span class="sep">|</span>
<span><span id="hb-tps" class="c-green">0.0</span> <span class="c-green">tok/s</span></span>
<span class="sep">|</span>
<span>recall <span id="hb-recall" class="c-yellow">—</span></span>
<span class="sep">|</span>
<span>sessions <span id="hb-sessions" class="c-peach">0</span></span>
</div>
<div class="right">
<span>cpu <span id="hb-cpu" class="c-teal">—</span> <span id="hb-temp" class="c-peach">—</span></span>
<span class="sep">|</span>
<span>mem <span id="hb-mem" class="c-blue">—</span></span>
<span class="sep">|</span>
<span id="hb-os" class="c-subtext1">—</span>
<span class="sep">|</span>
<span>up <span id="hb-uptime" class="c-green">—</span></span>
<span class="sep">|</span>
<span id="hb-clock" class="c-lavender">--:--</span>
</div>
</div>
<div id="tiles" class="tile-container"></div>
<script>
const tiles=[];let focusedId=null,nextId=0;

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e}
function span(cls,text){return el('span',cls,text)}

function createChatTile(id){
  const t=el('div','tile');t.dataset.id=id;
  const hdr=el('div','tile-header');
  const hl=el('span','');const ht=span('c-lavender','chat');hl.appendChild(ht);hl.appendChild(document.createTextNode(' session '+id));
  hdr.appendChild(hl);
  const cb=el('button','tile-close','×');cb.onclick=()=>closeTile(id);hdr.appendChild(cb);
  t.appendChild(hdr);
  const body=el('div','chat-body');body.id='chat-body-'+id;t.appendChild(body);
  const area=el('div','chat-input-area');
  const box=el('div','chat-input-box');
  const inp=el('input','chat-input');inp.placeholder='Message Olorin...';inp.autocomplete='off';
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat(id,body,inp)}});
  const btn=el('button','chat-send','↑');btn.onclick=()=>sendChat(id,body,inp);
  box.appendChild(inp);box.appendChild(btn);area.appendChild(box);t.appendChild(area);
  return t;
}

function addChatMsg(body,role,text){
  const row=el('div','chat-msg');
  const av=el('div','chat-avatar '+role);av.textContent=role==='user'?'P':'◆';
  const content=el('div','');
  const sender=el('div','chat-sender'+(role==='assistant'?' assistant':''));sender.textContent=role==='user'?'You':'Olorin';
  const bubble=el('div','chat-bubble');bubble.textContent=text;
  content.appendChild(sender);content.appendChild(bubble);row.appendChild(av);row.appendChild(content);
  body.appendChild(row);body.scrollTop=body.scrollHeight;
  return bubble;
}

async function sendChat(id,body,input){
  const text=input.value.trim();if(!text)return;input.value='';
  addChatMsg(body,'user',text);
  const bubble=addChatMsg(body,'assistant','');
  const cursor=el('span','cursor-blink');bubble.after(cursor);
  try{
    const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:text,temperature:0,repetition_penalty:1.1,max_tokens:512,recall_level:-1})});
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: ')||line==='data: [DONE]')continue;
        try{const ev=JSON.parse(line.slice(6));
          bubble.textContent+=ev.token;
          if(ev.tps)document.getElementById('hb-tps').textContent=ev.tps.toFixed(1);
          body.scrollTop=body.scrollHeight;
        }catch(_){}
      }
    }
  }catch(e){bubble.textContent+=' [error: '+e.message+']';}
  cursor.remove();
}

function createReplTile(id){
  const t=el('div','tile');t.dataset.id=id;
  const hdr=el('div','tile-header');
  const hl=el('span','');const ht=span('c-mauve','repl');hl.appendChild(ht);hl.appendChild(document.createTextNode(' olorin'));
  hdr.appendChild(hl);
  const cb=el('button','tile-close','×');cb.onclick=()=>closeTile(id);hdr.appendChild(cb);
  t.appendChild(hdr);
  const body=el('div','repl-body');body.id='repl-body-'+id;t.appendChild(body);
  const iline=el('div','repl-input-line');
  const prompt=span('repl-prompt','olorin ▸ ');iline.appendChild(prompt);
  const inp=el('input','repl-input');inp.autocomplete='off';
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendCommand(id,body,inp)}});
  iline.appendChild(inp);t.appendChild(iline);
  return t;
}

async function sendCommand(id,body,input){
  const text=input.value.trim();if(!text)return;input.value='';
  const cmdLine=el('div','repl-line');
  const p=span('repl-prompt','olorin ▸ ');cmdLine.appendChild(p);cmdLine.appendChild(document.createTextNode(text));
  body.appendChild(cmdLine);
  if(text.startsWith('/')){
    try{
      const res=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:text})});
      const d=await res.json();
      const out=el('div','repl-line '+(d.success?'repl-success':'repl-output'));out.textContent=d.output||'(no output)';
      body.appendChild(out);
    }catch(e){const err=el('div','repl-line repl-output');err.textContent='error: '+e.message;body.appendChild(err);}
  }else{
    const out=el('div','repl-line repl-output');out.textContent='';body.appendChild(out);
    try{
      const res=await fetch('/api/generate',{method:'POST',
        body:JSON.stringify({prompt:text,temperature:0.7,repetition_penalty:1.1,max_tokens:512,recall_level:-1})});
      const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
      while(true){
        const{done,value}=await reader.read();if(done)break;
        buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
        for(const line of lines){
          if(!line.startsWith('data: '))continue;const payload=line.slice(6);
          if(payload==='[DONE]')continue;
          try{const ev=JSON.parse(payload);out.textContent+=ev.token;
            document.getElementById('hb-tps').textContent=ev.tps.toFixed(1);
          }catch(e){}
        }
        body.scrollTop=body.scrollHeight;
      }
    }catch(e){out.textContent+=' [error: '+e.message+']';}
  }
  const sep=el('div','repl-line repl-muted');sep.textContent='─────';body.appendChild(sep);
  body.scrollTop=body.scrollHeight;
}

function createTermTile(id){
  const t=el('div','tile');t.dataset.id=id;
  const hdr=el('div','tile-header');
  const hl=el('span','');const ht=span('c-green','term');hl.appendChild(ht);hl.appendChild(document.createTextNode(' shell'));
  hdr.appendChild(hl);
  const cb=el('button','tile-close','×');cb.onclick=()=>{
    fetch('/api/term/'+t._termId+'/close',{method:'POST'});closeTile(id);
  };hdr.appendChild(cb);
  t.appendChild(hdr);
  const canvas=document.createElement('canvas');canvas.className='term-canvas';
  t.appendChild(canvas);
  t._canvas=canvas;t._termId=null;t._cells={};t._cursor=[0,0];t._cols=80;t._rows=24;
  t._cellW=0;t._cellH=0;
  fetch('/api/term/open',{method:'POST'}).then(r=>r.json()).then(d=>{
    t._termId=d.id;
    initTermCanvas(t);
    startTermStream(t);
  });
  return t;
}

function initTermCanvas(t){
  const canvas=t._canvas;
  const rect=canvas.parentElement.getBoundingClientRect();
  const ctx=canvas.getContext('2d');
  ctx.font='13px "JetBrains Mono",monospace';
  const m=ctx.measureText('M');
  t._cellW=Math.ceil(m.width);
  t._cellH=Math.ceil(13*1.4);
  t._cols=Math.floor(rect.width/t._cellW)||80;
  t._rows=Math.floor((rect.height-28)/t._cellH)||24;
  canvas.width=t._cols*t._cellW;
  canvas.height=t._rows*t._cellH;
  canvas.style.width=canvas.width+'px';
  canvas.style.height=canvas.height+'px';
  ctx.fillStyle='#1e1e2e';ctx.fillRect(0,0,canvas.width,canvas.height);
  if(t._termId!=null){
    fetch('/api/term/'+t._termId+'/resize',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cols:t._cols,rows:t._rows})});
  }
  canvas.tabIndex=0;
  canvas.addEventListener('keydown',e=>{
    e.preventDefault();
    let seq='';
    if(e.key.length===1&&!e.ctrlKey&&!e.altKey){seq=e.key;}
    else if(e.key==='Enter'){seq='\r';}
    else if(e.key==='Backspace'){seq='\x7f';}
    else if(e.key==='Tab'){seq='\t';}
    else if(e.key==='Escape'){seq='\x1b';}
    else if(e.key==='ArrowUp'){seq='\x1b[A';}
    else if(e.key==='ArrowDown'){seq='\x1b[B';}
    else if(e.key==='ArrowRight'){seq='\x1b[C';}
    else if(e.key==='ArrowLeft'){seq='\x1b[D';}
    else if(e.key==='Home'){seq='\x1b[H';}
    else if(e.key==='End'){seq='\x1b[F';}
    else if(e.key==='Delete'){seq='\x1b[3~';}
    else if(e.ctrlKey&&e.key.length===1){
      const code=e.key.toLowerCase().charCodeAt(0)-96;
      if(code>0&&code<27)seq=String.fromCharCode(code);
    }
    if(seq&&t._termId!=null){
      const enc=new TextEncoder();
      fetch('/api/term/'+t._termId+'/input',{method:'POST',body:enc.encode(seq)})
        .then(r=>r.json()).then(d=>{
          if(d.blocked){
            canvas.style.boxShadow='0 0 0 2px #f38ba8';
            setTimeout(()=>{canvas.style.boxShadow='';},500);
          }
        }).catch(()=>{});
    }
  });
  new ResizeObserver(()=>{
    const r2=canvas.parentElement.getBoundingClientRect();
    const nc=Math.floor(r2.width/t._cellW)||80;
    const nr=Math.floor((r2.height-28)/t._cellH)||24;
    if(nc!==t._cols||nr!==t._rows){
      t._cols=nc;t._rows=nr;
      canvas.width=nc*t._cellW;canvas.height=nr*t._cellH;
      canvas.style.width=canvas.width+'px';canvas.style.height=canvas.height+'px';
      const ctx2=canvas.getContext('2d');
      ctx2.fillStyle='#1e1e2e';ctx2.fillRect(0,0,canvas.width,canvas.height);
      if(t._termId!=null){
        fetch('/api/term/'+t._termId+'/resize',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({cols:nc,rows:nr})});
      }
    }
  }).observe(canvas.parentElement);
}

function startTermStream(t){
  const es=new EventSource('/api/term/'+t._termId+'/stream');
  const canvas=t._canvas;
  es.onmessage=function(ev){
    const d=JSON.parse(ev.data);
    if(d.type==='frame'){
      const ctx=canvas.getContext('2d');
      ctx.font='13px "JetBrains Mono",monospace';
      ctx.textBaseline='top';
      const cw=t._cellW,ch=t._cellH;
      for(const c of d.cells){
        ctx.fillStyle=c.bg;
        ctx.fillRect(c.c*cw,c.r*ch,cw,ch);
        ctx.fillStyle=c.fg;
        if(c.fl&1)ctx.font='bold 13px "JetBrains Mono",monospace';
        ctx.fillText(c.ch,c.c*cw,c.r*ch+2);
        if(c.fl&1)ctx.font='13px "JetBrains Mono",monospace';
      }
      if(t._prevCursor){
        const[pc,pr]=t._prevCursor;
        ctx.fillStyle='#1e1e2e';ctx.fillRect(pc*cw,pr*ch,cw,ch);
      }
      const[cc,cr]=d.cursor;
      ctx.fillStyle='#cdd6f4';ctx.globalAlpha=0.7;
      ctx.fillRect(cc*cw,cr*ch,cw,ch);ctx.globalAlpha=1.0;
      t._prevCursor=d.cursor;
    }else if(d.type==='exit'){
      es.close();
    }
  };
  es.onerror=function(){es.close();};
  t._eventSource=es;
}

function openTile(type){
  const id=nextId++;
  const t=type==='chat'?createChatTile(id):type==='repl'?createReplTile(id):createTermTile(id);
  tiles.push({id,type,el:t});
  document.getElementById('tiles').appendChild(t);
  updateGrid();focusTile(id);
}
function closeTile(id){
  const idx=tiles.findIndex(t=>t.id===id);if(idx<0)return;
  tiles[idx].el.remove();tiles.splice(idx,1);updateGrid();
  if(tiles.length>0)focusTile(tiles[tiles.length-1].id);
}
function focusTile(id){
  tiles.forEach(t=>t.el.classList.toggle('focused',t.id===id));focusedId=id;
  const tile=tiles.find(t=>t.id===id);
  if(tile){
    const canvas=tile.el.querySelector('canvas');
    if(canvas){canvas.focus()}
    else{const inp=tile.el.querySelector('input');if(inp)inp.focus()}
  }
}
function updateGrid(){
  const c=document.getElementById('tiles'),n=tiles.length;
  if(n===0)c.style.gridTemplateColumns='1fr';
  else if(n<=2)c.style.gridTemplateColumns='repeat('+n+',1fr)';
  else c.style.gridTemplateColumns='repeat(auto-fit,minmax(400px,1fr))';
  document.getElementById('hb-sessions').textContent=n;
}
document.addEventListener('keydown',e=>{
  if(!e.altKey)return;
  if(e.key==='t'){e.preventDefault();openTile('repl')}
  else if(e.key==='c'){e.preventDefault();openTile('chat')}
  else if(e.key==='s'){e.preventDefault();openTile('term')}
  else if(e.key==='w'){e.preventDefault();if(focusedId!=null)closeTile(focusedId)}
  else if(e.key>='1'&&e.key<='9'){e.preventDefault();const i=parseInt(e.key)-1;if(i<tiles.length)focusTile(tiles[i].id)}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    e.preventDefault();const idx=tiles.findIndex(t=>t.id===focusedId);if(idx<0)return;
    const next=e.key==='ArrowLeft'?(idx+1)%tiles.length:(idx-1+tiles.length)%tiles.length;
    focusTile(tiles[next].id);
  }
});
openTile('chat');openTile('repl');

fetch('/api/model').then(r=>r.json()).then(d=>{
  document.getElementById('hb-model').textContent=d.name||'olorin';
  document.getElementById('hb-backend').textContent=d.backend||'cougar';
}).catch(()=>{});
function updateSystem(){
  fetch('/api/system').then(r=>r.json()).then(d=>{
    document.getElementById('hb-cpu').textContent=d.cpu_percent+'%';
    document.getElementById('hb-temp').textContent=d.cpu_temp!=null?d.cpu_temp+'°C':'–';
    const m=(d.memory_used_mb/1024).toFixed(1),t=(d.memory_total_mb/1024).toFixed(1);
    document.getElementById('hb-mem').textContent=m+'G/'+t+'G';
    document.getElementById('hb-os').textContent=d.os+' '+d.arch;
    const h=Math.floor(d.uptime_seconds/3600),mi=Math.floor((d.uptime_seconds%3600)/60);
    document.getElementById('hb-uptime').textContent=h+'h '+mi+'m';
    if(d.recall_level!=null)document.getElementById('hb-recall').textContent=d.recall_level;
  }).catch(()=>{});
}
updateSystem();setInterval(updateSystem,3000);
setInterval(()=>{const now=new Date();
  document.getElementById('hb-clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
},1000);
</script>
</body></html>
