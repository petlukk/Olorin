<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olorin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--crust:#11111b;--mantle:#181825;--base:#1e1e2e;--surface0:#313244;--surface1:#45475a;
--overlay0:#6c7086;--text:#cdd6f4;--subtext0:#a6adc8;--subtext1:#bac2de;
--lavender:#b4befe;--teal:#94e2d5;--green:#a6e3a1;--yellow:#f9e2af;
--peach:#fab387;--red:#f38ba8;--mauve:#cba6f7;--blue:#89b4fa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--crust);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hyprbar{height:32px;background:var(--mantle);border-bottom:1px solid var(--surface0);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:12px/32px 'JetBrains Mono',monospace;color:var(--subtext0);user-select:none}
.hyprbar .left,.hyprbar .right{display:flex;align-items:center;gap:14px}
.hyprbar .sep{color:var(--surface1)}
.tile-container{flex:1;display:grid;gap:2px;background:var(--crust);overflow:hidden}
.tile{display:flex;flex-direction:column;background:var(--base);border-radius:4px;overflow:hidden}
.tile.focused{box-shadow:0 0 0 2px var(--lavender)}
.tile-header{height:28px;background:var(--mantle);font:11px/28px 'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--subtext0)}
.c-lavender{color:var(--lavender)}.c-teal{color:var(--teal)}.c-green{color:var(--green)}
.c-yellow{color:var(--yellow)}.c-peach{color:var(--peach)}.c-red{color:var(--red)}
.c-mauve{color:var(--mauve)}.c-blue{color:var(--blue)}.c-text{color:var(--text)}.c-subtext1{color:var(--subtext1)}
.tile-close{background:none;border:none;color:var(--overlay0);cursor:pointer;font:14px monospace;padding:0 2px}
.tile-close:hover{color:var(--red)}
.chat-body{display:flex;flex-direction:column;gap:24px;font-family:'Inter',system-ui,sans-serif;overflow-y:auto;padding:24px 20px;flex:1;min-height:0}
.chat-body.drag-over{outline:2px dashed var(--teal,#94e2d5);outline-offset:-8px;background:rgba(148,226,213,0.06)}
.chat-msg{display:flex;gap:14px}
.chat-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 14px 'JetBrains Mono',monospace;flex-shrink:0}
.chat-avatar.user{background:var(--surface1);color:var(--lavender)}
.chat-avatar.assistant{background:var(--teal);color:var(--crust)}
.chat-sender{font-size:13px;font-weight:600;color:var(--subtext1);margin-bottom:6px}
.chat-sender.assistant{color:var(--teal)}
.chat-bubble{font-size:13px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-wrap:break-word;font-family:'JetBrains Mono',monospace}

/* Plot charts render in their own block: line-height 1 so the block glyphs
   (▁▂▃▄▅▆▇█) touch vertically into solid bars (1.5 leaves gaps that shatter
   them), white-space:pre so the grid never wraps, and a single block-covering
   monospace (the Google-subsetted JetBrains Mono lacks Block Elements + Box
   Drawing, which would fall back to a metrically-different font and skew the
   columns). overflow-x lets a wide chart scroll instead of breaking. */
/* line-height 0.8 (not 1.0): DejaVu's block glyphs don't fill the line box, so
   at integer-pixel rendering 1.0 leaves hairline gaps that break the bars — and
   the gap is sub-pixel-position-dependent, so a value just under 1 isn't
   reliable. 0.8 overlaps rows enough to stay solid at any alignment (overlapping
   solid blocks remain solid — only gaps are wrong). overflow-y:hidden because
   overflow-x:auto otherwise forces overflow-y to auto and a sub-pixel overflow
   spawns a stray vertical scrollbar. */
.chart{line-height:0.8;white-space:pre;overflow-x:auto;overflow-y:hidden;font-family:'OlorinChartMono','DejaVu Sans Mono',ui-monospace,'Liberation Mono',Menlo,Consolas,monospace}
.chat-input-area{padding:16px 20px;border-top:1px solid var(--surface0);background:var(--mantle)}
.chat-input-box{display:flex;align-items:center;gap:8px;background:var(--base);border:1px solid var(--surface1);border-radius:12px;padding:10px 16px}
.chat-input-box:focus-within{border-color:var(--lavender)}
.chat-input{flex:1;background:transparent;border:none;color:var(--text);font:14px 'Inter',system-ui,sans-serif;outline:none}
.chat-send{background:var(--lavender);color:var(--crust);border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px}
.cursor-blink{display:inline-block;width:2px;height:16px;background:var(--teal);vertical-align:text-bottom;animation:blink 1s step-end infinite}
.report-link{display:inline-block;margin:6px 0 2px;font-size:13px;color:var(--teal);cursor:pointer;text-decoration:none}
.report-link:hover{text-decoration:underline}
.cursor-thinking{display:inline-block;color:var(--overlay0);font-size:12px;font-style:italic;margin-left:6px;animation:pulse 1.5s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
.repl-body{flex:1;overflow-y:auto;padding:12px;font:13px/1.6 'JetBrains Mono',monospace;min-height:0}
.repl-line{margin-bottom:4px}
.repl-prompt{color:var(--mauve)}
.repl-output{color:var(--subtext1);padding-left:16px}
.repl-success{color:var(--green)}
.repl-muted{color:var(--overlay0)}
.repl-input-line{display:flex;align-items:center;padding:8px 12px;border-top:1px solid var(--surface0);background:var(--mantle);font:13px 'JetBrains Mono',monospace}
.repl-input{flex:1;background:transparent;border:none;color:var(--text);font:13px 'JetBrains Mono',monospace;outline:none;padding:0}
.repl-cursor{display:inline-block;width:7px;height:15px;background:var(--mauve);animation:blink 1s step-end infinite;vertical-align:text-bottom}
.term-canvas{flex:1;min-height:0;width:100%;display:block;background:var(--base);image-rendering:pixelated;outline:none}
.cfg-overlay{position:fixed;inset:0;background:rgba(17,17,27,0.85);display:none;z-index:100;align-items:center;justify-content:center}.cfg-overlay.open{display:flex}
.cfg-panel{background:var(--base);border:1px solid var(--surface0);border-radius:8px;padding:20px;width:480px;max-height:80vh;overflow-y:auto;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px}
.cfg-panel h2{margin:0 0 16px;font-size:14px;color:var(--lavender)}.cfg-section{margin-bottom:16px}
.cfg-section h3{margin:0 0 8px;font-size:12px;color:var(--mauve);text-transform:uppercase;letter-spacing:1px}
.cfg-row{display:flex;align-items:center;margin-bottom:8px;gap:8px}.cfg-row label{width:120px;color:var(--subtext1);flex-shrink:0}
.cfg-row input[type=range]{flex:1;accent-color:var(--teal)}.cfg-row select,.cfg-row textarea,.cfg-row input[type=number],.cfg-row input[type=text],.cfg-row input[type=password]{background:var(--surface0);border:1px solid var(--surface1);color:var(--text);padding:4px 8px;border-radius:4px;font-family:inherit;font-size:12px}
.cfg-row input[type=number],.cfg-row input[type=text],.cfg-row input[type=password]{width:70px}.cfg-row input[type=text].wide,.cfg-row input[type=password].wide,.cfg-row textarea{width:100%;flex:1}
.cfg-row textarea{resize:vertical;min-height:60px}.cfg-buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.cfg-buttons button{padding:6px 16px;border:none;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
.cfg-btn-apply{background:var(--teal);color:var(--base)}.cfg-btn-cancel{background:var(--surface1);color:var(--text)}
.cfg-scope{display:flex;gap:12px;align-items:center;margin-bottom:16px;color:var(--subtext1)}.cfg-scope label{width:auto}

<script>
const tiles=[];let focusedId=null,nextId=0;

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e}
function span(cls,text){return el('span',cls,text)}

function createChatTile(id){
  const t=el('div','tile');t.dataset.id=id;
  const hdr=el('div','tile-header');
  const hl=el('span','');const ht=span('c-lavender','chat');hl.appendChild(ht);hl.appendChild(document.createTextNode(' session '+id));
  hdr.appendChild(hl);
  const cb=el('button','tile-close','×');cb.onclick=()=>closeTile(id);hdr.appendChild(cb);
  t.appendChild(hdr);
  const body=el('div','chat-body');body.id='chat-body-'+id;t.appendChild(body);
  // Drop a file anywhere in the chat body to analyze it.
  body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('drag-over')});
  body.addEventListener('dragleave',()=>body.classList.remove('drag-over'));
  body.addEventListener('drop',e=>{e.preventDefault();body.classList.remove('drag-over');analyzeFiles(id,body,e.dataTransfer.files)});
  const area=el('div','chat-input-area');
  const box=el('div','chat-input-box');
  const inp=el('input','chat-input');inp.placeholder='Message Olorin, or drop a file to analyze...';inp.autocomplete='off';
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat(id,body,inp)}});
  // Attach button + hidden file input for click-to-pick.
  const fileInp=el('input');fileInp.type='file';fileInp.multiple=true;fileInp.style.display='none';
  fileInp.addEventListener('change',()=>{analyzeFiles(id,body,fileInp.files);fileInp.value=''});
  const clip=el('button','chat-send','📎');clip.title='Analyze a file';clip.onclick=()=>fileInp.click();
  const btn=el('button','chat-send','↑');btn.onclick=()=>sendChat(id,body,inp);
  box.appendChild(inp);box.appendChild(clip);box.appendChild(btn);box.appendChild(fileInp);
  area.appendChild(box);t.appendChild(area);
  return t;
}

function addChatMsg(body,role,text){
  const row=el('div','chat-msg');
  const av=el('div','chat-avatar '+role);av.textContent=role==='user'?'P':'◆';
  const content=el('div','');
  const sender=el('div','chat-sender'+(role==='assistant'?' assistant':''));sender.textContent=role==='user'?'You':'Olorin';
  const bubble=el('div','chat-bubble');bubble._raw=text||'';renderBubble(bubble);
  content.appendChild(sender);content.appendChild(bubble);row.appendChild(av);row.appendChild(content);
  body.appendChild(row);body.scrollTop=body.scrollHeight;
  return bubble;
}

// Plot charts arrive in the SSE stream wrapped in RS-delimited markers (the
// server emits them only for the web surface). Render those segments in a
// dedicated .chart block (line-height 1, no wrap) so the block-bar grid lines
// up; everything else stays prose text in the bubble. Re-renders from the
// accumulated `_raw` each token so a marker that is still mid-stream is handled.
const PLOT_OPEN='',PLOT_CLOSE='';
function renderBubble(bubble){
  const raw=bubble._raw||'';bubble.textContent='';
  let i=0;
  while(i<raw.length){
    const o=raw.indexOf(PLOT_OPEN,i);
    if(o<0){bubble.appendChild(document.createTextNode(raw.slice(i)));break;}
    if(o>i)bubble.appendChild(document.createTextNode(raw.slice(i,o)));
    const c=raw.indexOf(PLOT_CLOSE,o+PLOT_OPEN.length);
    const pre=el('div','chart');
    if(c<0){pre.textContent=raw.slice(o+PLOT_OPEN.length);bubble.appendChild(pre);break;}
    pre.textContent=raw.slice(o+PLOT_OPEN.length,c);bubble.appendChild(pre);
    i=c+PLOT_CLOSE.length;
  }
}

// Render an SSE token stream from `res` into `bubble`, driving the thinking cursor.
async function renderSSE(res,bubble,cursor,body){
  const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
  while(true){
    const{done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const line of lines){
      if(!line.startsWith('data: ')||line==='data: [DONE]')continue;
      try{const ev=JSON.parse(line.slice(6));
        if(ev.thinking===true){cursor.textContent=' \u2026pondering';cursor.className='cursor-thinking';}
        else if(ev.thinking===false){cursor.textContent='';cursor.className='cursor-blink';}
        else if(ev.error){bubble._raw=(bubble._raw||'')+ev.error;renderBubble(bubble);}
        else if(ev.token!=null){bubble._raw=(bubble._raw||'')+ev.token;renderBubble(bubble);cursor.textContent='';cursor.className='cursor-blink';}
        if(ev.tps)document.getElementById('hb-tps').textContent=ev.tps.toFixed(1);
        body.scrollTop=body.scrollHeight;
      }catch(_){}
    }
  }
}

async function sendChat(id,body,input){
  const text=input.value.trim();if(!text)return;input.value='';
  addChatMsg(body,'user',text);
  const bubble=addChatMsg(body,'assistant','');
  const cursor=el('span','cursor-blink');bubble.after(cursor);
  try{
    const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({prompt:text},tileConfig(id)))});
    await renderSSE(res,bubble,cursor,body);
  }catch(e){bubble.textContent+=' [error: '+e.message+']';}
  cursor.remove();
}

// Read a File as base64 (strip the data: URL prefix the server tolerates anyway).
function fileToB64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result).split(',').pop());
    r.onerror=()=>reject(r.error||new Error('read failed'));
    r.readAsDataURL(file);
  });
}

// Drop/attach handler: analyze a file via /api/analyze, rendering into the chat.
async function analyzeFiles(id,body,files){
  if(!files||!files.length)return;
  const list=Array.from(files);
  addChatMsg(body,'user','\ud83d\udcce '+list.map(f=>f.name).join(', '));
  const bubble=addChatMsg(body,'assistant','');
  const cursor=el('span','cursor-blink');bubble.after(cursor);
  try{
    let res;
    if(list.length===1){
      // single file: stream the raw bytes (no base64) so multi-GB logs work
      res=await fetch('/api/analyze_raw',{method:'POST',headers:{'X-Filename':list[0].name},body:list[0]});
    }else{
      // multiple files: base64 JSON for cross-file correlation
      const payload=await Promise.all(list.map(async f=>({name:f.name,b64:await fileToB64(f)})));
      res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({files:payload})});
    }
    await renderSSE(res,bubble,cursor,body);
    addReportLink(body,list);
  }catch(e){bubble.textContent+=' [error: '+e.message+']';}
  cursor.remove();
}

// After an analysis completes, offer the same files as a downloadable
// self-contained HTML report (/api/report, deterministic, no model).
// Re-posts the kept File handles — staged copies are deleted server-side
// after each request, so there is no server state to reference.
function addReportLink(body,list){
  const a=el('a','report-link','📄 download report');
  a.href='#';
  a.onclick=async e=>{
    e.preventDefault();a.textContent='⏳ building report…';
    try{
      let res;
      if(list.length===1){
        // single file: stream raw bytes so big logs don't overflow the JSON body cap
        res=await fetch('/api/report_raw',{method:'POST',headers:{'X-Filename':list[0].name},body:list[0]});
      }else{
        const payload=await Promise.all(list.map(async f=>({name:f.name,b64:await fileToB64(f)})));
        res=await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({files:payload})});
      }
      if(!res.ok)throw new Error(await res.text());
      const blob=await res.blob();
      const url=URL.createObjectURL(blob);
      const dl=document.createElement('a');
      dl.href=url;dl.download='olorin-report.html';dl.click();
      URL.revokeObjectURL(url);
      a.textContent='📄 download report';
    }catch(err){a.textContent='📄 report failed: '+err.message;}
  };
  body.appendChild(a);
}

function createReplTile(id){
  const t=el('div','tile');t.dataset.id=id;
  const hdr=el('div','tile-header');
  const hl=el('span','');const ht=span('c-mauve','repl');hl.appendChild(ht);hl.appendChild(document.createTextNode(' Olorin'));
  hdr.appendChild(hl);
  const cb=el('button','tile-close','×');cb.onclick=()=>closeTile(id);hdr.appendChild(cb);
  t.appendChild(hdr);
  const body=el('div','repl-body');body.id='repl-body-'+id;t.appendChild(body);
  const iline=el('div','repl-input-line');
  const prompt=span('repl-prompt','Olorin ▸ ');iline.appendChild(prompt);
  const inp=el('input','repl-input');inp.autocomplete='off';
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendCommand(id,body,inp)}});
  iline.appendChild(inp);t.appendChild(iline);
  return t;
}

async function sendCommand(id,body,input){
  const text=input.value.trim();if(!text)return;input.value='';
  const cmdLine=el('div','repl-line');
  const p=span('repl-prompt','Olorin ▸ ');cmdLine.appendChild(p);cmdLine.appendChild(document.createTextNode(text));
  body.appendChild(cmdLine);
  if(text.startsWith('/')){
    try{
      const res=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:text})});
      const d=await res.json();
      const out=el('div','repl-line '+(d.success?'repl-success':'repl-output'));out.textContent=d.output||'(no output)';
      body.appendChild(out);
    }catch(e){const err=el('div','repl-line repl-output');err.textContent='error: '+e.message;body.appendChild(err);}
  }else{
    const out=el('div','repl-line repl-output');out.textContent='';body.appendChild(out);
    try{
      const res=await fetch('/api/generate',{method:'POST',
        body:JSON.stringify(Object.assign({prompt:text},tileConfig(id)))});
      const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
      while(true){
        const{done,value}=await reader.read();if(done)break;
        buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
        for(const line of lines){
          if(!line.startsWith('data: '))continue;const payload=line.slice(6);
          if(payload==='[DONE]')continue;
          try{const ev=JSON.parse(payload);
            if(ev.error){out.textContent+=ev.error;}
            else if(ev.token!=null){out.textContent+=ev.token;}
            if(ev.tps)document.getElementById('hb-tps').textContent=ev.tps.toFixed(1);
          }catch(e){}
        }
        body.scrollTop=body.scrollHeight;
      }
    }catch(e){out.textContent+=' [error: '+e.message+']';}
  }
  const sep=el('div','repl-line repl-muted');sep.textContent='─────';body.appendChild(sep);
  body.scrollTop=body.scrollHeight;
}

function createTermTile(id){
  const t=el('div','tile');t.dataset.id=id;
  const hdr=el('div','tile-header');
  const hl=el('span','');const ht=span('c-green','term');hl.appendChild(ht);hl.appendChild(document.createTextNode(' shell'));
  hdr.appendChild(hl);
  const cb=el('button','tile-close','×');cb.onclick=()=>{
    if(t._ws)t._ws.close();
    fetch('/api/term/'+t._termId+'/close',{method:'POST'});closeTile(id);
  };hdr.appendChild(cb);
  t.appendChild(hdr);
  const wrap=document.createElement('div');wrap.style.cssText='position:relative;flex:1;min-height:0;overflow:hidden';
  const canvas=document.createElement('canvas');canvas.className='term-canvas';
  const tinp=document.createElement('textarea');
  tinp.className='term-input';tinp.autocomplete='off';tinp.spellcheck=false;
  tinp.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:default;resize:none;padding:0;border:0';
  wrap.appendChild(canvas);wrap.appendChild(tinp);t.appendChild(wrap);
  t._canvas=canvas;t._tinp=tinp;t._termId=null;t._cells={};t._cursor=[0,0];t._cols=80;t._rows=24;
  t._cellW=0;t._cellH=0;
  fetch('/api/term/open',{method:'POST'}).then(r=>r.json()).then(d=>{
    t._termId=d.id;
    requestAnimationFrame(()=>{initTermCanvas(t);startTermStream(t);tinp.focus();});
  });
  return t;
}

function initTermCanvas(t){
  const canvas=t._canvas;
  const rect=t.getBoundingClientRect();
  const ctx=canvas.getContext('2d');
  ctx.font='13px "JetBrains Mono",monospace';
  t._cellW=8;
  t._cellH=16;
  t._cols=Math.floor(rect.width/t._cellW)||80;
  t._rows=Math.floor((rect.height-28)/t._cellH)||24;
  canvas.width=t._cols*t._cellW;
  canvas.height=t._rows*t._cellH;
  canvas.style.width=canvas.width+'px';
  canvas.style.height=canvas.height+'px';
  ctx.fillStyle='#1e1e2e';ctx.fillRect(0,0,canvas.width,canvas.height);
  if(t._termId!=null){
    fetch('/api/term/'+t._termId+'/resize',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cols:t._cols,rows:t._rows})});
  }
  const tinp=t._tinp;
  tinp.addEventListener('keydown',e=>{
    if(e.altKey)return;
    e.preventDefault();
    let seq='';
    if(e.key.length===1&&!e.ctrlKey){seq=e.key;}
    else if(e.key==='Enter'){seq='\r';}
    else if(e.key==='Backspace'){seq='\x7f';}
    else if(e.key==='Tab'){seq='\t';}
    else if(e.key==='Escape'){seq='\x1b';}
    else if(e.key==='ArrowUp'){seq='\x1b[A';}
    else if(e.key==='ArrowDown'){seq='\x1b[B';}
    else if(e.key==='ArrowRight'){seq='\x1b[C';}
    else if(e.key==='ArrowLeft'){seq='\x1b[D';}
    else if(e.key==='Home'){seq='\x1b[H';}
    else if(e.key==='End'){seq='\x1b[F';}
    else if(e.key==='Delete'){seq='\x1b[3~';}
    else if(e.ctrlKey&&e.key.length===1){
      const code=e.key.toLowerCase().charCodeAt(0)-96;
      if(code>0&&code<27)seq=String.fromCharCode(code);
    }
    if(seq&&t._ws&&t._ws.readyState===WebSocket.OPEN){
      // Send over the WebSocket; the authoritative server frame renders the
      // result. No optimistic local echo — it can't tell a normal prompt from
      // a no-echo password read, so it would paint plaintext on screen.
      t._ws.send(new TextEncoder().encode(seq));
    }
    tinp.value='';
  });
  new ResizeObserver(()=>{
    const r2=t.getBoundingClientRect();
    const nc=Math.floor(r2.width/t._cellW)||80;
    const nr=Math.floor((r2.height-28)/t._cellH)||24;
    if(nc!==t._cols||nr!==t._rows){
      t._cols=nc;t._rows=nr;
      canvas.width=nc*t._cellW;canvas.height=nr*t._cellH;
      canvas.style.width=canvas.width+'px';canvas.style.height=canvas.height+'px';
      const ctx2=canvas.getContext('2d');
      ctx2.font='13px "JetBrains Mono",monospace';
      ctx2.fillStyle='#1e1e2e';ctx2.fillRect(0,0,canvas.width,canvas.height);
      t._cellCache={};
      t._prevCursor=null;
      if(t._termId!=null){
        fetch('/api/term/'+t._termId+'/resize',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({cols:nc,rows:nr})});
      }
    }
  }).observe(t);
}

function startTermStream(t){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(proto+'//'+location.host+'/api/term/'+t._termId+'/ws');
  const canvas=t._canvas;
  ws.onmessage=function(ev){
    const d=JSON.parse(ev.data);
    if(d.type==='frame'){
      const ctx=canvas.getContext('2d');
      ctx.textBaseline='alphabetic';
      const cw=t._cellW,ch=t._cellH;
      if(!t._cellCache)t._cellCache={};
      for(const c of d.cells){
        t._cellCache[c.r+','+c.c]=c;
      }
      // Two-pass redraw: paint normal cells, then bold cells. Avoids the
      // per-cell font swap that was the second-most-expensive thing in the
      // SSE handler on Pi.
      ctx.font='13px "JetBrains Mono",monospace';
      for(const c of d.cells){
        if(c.fl&1)continue;
        ctx.fillStyle=c.bg;ctx.fillRect(c.c*cw,c.r*ch,cw,ch);
        ctx.fillStyle=c.fg;ctx.fillText(c.ch,c.c*cw,c.r*ch+12);
      }
      ctx.font='bold 13px "JetBrains Mono",monospace';
      for(const c of d.cells){
        if(!(c.fl&1))continue;
        ctx.fillStyle=c.bg;ctx.fillRect(c.c*cw,c.r*ch,cw,ch);
        ctx.fillStyle=c.fg;ctx.fillText(c.ch,c.c*cw,c.r*ch+12);
      }
      ctx.font='13px "JetBrains Mono",monospace';
      // Restore previous cursor cell
      if(t._prevCursor){
        const[pc,pr]=t._prevCursor;
        const prev=t._cellCache[pr+','+pc];
        ctx.fillStyle=prev?prev.bg:'#1e1e2e';
        ctx.fillRect(pc*cw,pr*ch,cw,ch);
        if(prev&&prev.ch!==' '){
          ctx.fillStyle=prev.fg;ctx.fillText(prev.ch,pc*cw,pr*ch+12);
        }
      }
      // Draw cursor block (inverted)
      const[cc,cr]=d.cursor;
      ctx.fillStyle='#cdd6f4';ctx.fillRect(cc*cw,cr*ch,cw,ch);
      const cur=t._cellCache[cr+','+cc];
      if(cur){ctx.fillStyle='#1e1e2e';ctx.fillText(cur.ch,cc*cw,cr*ch+12);}
      t._prevCursor=d.cursor;
    }else if(d.type==='blocked'){
      // Safety scan rejected the line — flash the tile border (the feedback
      // the old /input POST path used to provide).
      canvas.style.boxShadow='0 0 0 2px #f38ba8';
      setTimeout(()=>{canvas.style.boxShadow='';},500);
    }else if(d.type==='exit'){
      ws.close();
    }
  };
  ws.onerror=function(){ws.close();};
  ws.onclose=function(){t._ws=null;};
  t._ws=ws;
}

function openTile(type){
  const id=nextId++;
  const t=type==='chat'?createChatTile(id):type==='repl'?createReplTile(id):createTermTile(id);
  tiles.push({id,type,el:t});
  document.getElementById('tiles').appendChild(t);
  updateGrid();focusTile(id);
}
function closeTile(id){
  const idx=tiles.findIndex(t=>t.id===id);if(idx<0)return;
  tiles[idx].el.remove();tiles.splice(idx,1);updateGrid();
  if(tiles.length>0)focusTile(tiles[tiles.length-1].id);
}
function focusTile(id){
  tiles.forEach(t=>t.el.classList.toggle('focused',t.id===id));focusedId=id;
  const tile=tiles.find(t=>t.id===id);
  if(tile){
    const tinp=tile.el.querySelector('.term-input');
    if(tinp){tinp.focus()}
    else{const inp=tile.el.querySelector('input');if(inp)inp.focus()}
  }
}
function updateGrid(){
  const c=document.getElementById('tiles'),n=tiles.length;
  if(n===0)c.style.gridTemplateColumns='1fr';
  else if(n<=2)c.style.gridTemplateColumns='repeat('+n+',1fr)';
  else c.style.gridTemplateColumns='repeat(auto-fit,minmax(400px,1fr))';
  document.getElementById('hb-sessions').textContent=n;
}
document.addEventListener('keydown',e=>{
  if(!e.altKey)return;
  if(e.key==='t'){e.preventDefault();e.stopImmediatePropagation();openTile('repl')}
  else if(e.key==='c'){e.preventDefault();e.stopImmediatePropagation();openTile('chat')}
  else if(e.key==='s'){e.preventDefault();e.stopImmediatePropagation();openTile('term')}
  else if(e.key==='w'){e.preventDefault();if(focusedId!=null)closeTile(focusedId)}
  else if(e.key>='1'&&e.key<='9'){e.preventDefault();const i=parseInt(e.key)-1;if(i<tiles.length)focusTile(tiles[i].id)}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    e.preventDefault();const idx=tiles.findIndex(t=>t.id===focusedId);if(idx<0)return;
    const next=e.key==='ArrowLeft'?(idx+1)%tiles.length:(idx-1+tiles.length)%tiles.length;
    focusTile(tiles[next].id);
  }
},true);
openTile('chat');openTile('repl');

fetch('/api/model').then(r=>r.json()).then(d=>{
  document.getElementById('hb-model').textContent=d.name||'—';
  document.getElementById('hb-backend').textContent=d.backend||'cougar';
}).catch(()=>{});
function updateSystem(){
  fetch('/api/system').then(r=>r.json()).then(d=>{
    document.getElementById('hb-cpu').textContent=d.cpu_percent+'%';
    document.getElementById('hb-temp').textContent=d.cpu_temp!=null?d.cpu_temp+'°C':'–';
    const m=(d.memory_used_mb/1024).toFixed(1),t=(d.memory_total_mb/1024).toFixed(1);
    document.getElementById('hb-mem').textContent=m+'G/'+t+'G';
    document.getElementById('hb-os').textContent=d.os+' '+d.arch;
    const h=Math.floor(d.uptime_seconds/3600),mi=Math.floor((d.uptime_seconds%3600)/60);
    document.getElementById('hb-uptime').textContent=h+'h '+mi+'m';
    if(d.recall_level!=null)document.getElementById('hb-recall').textContent=d.recall_level;
    if(d.palantir)updatePalantir(d.palantir);
    if(d.config){
      const c=d.config;
      document.getElementById('hb-cfg-temp').textContent=c.temperature;
      document.getElementById('hb-cfg-topk').textContent=c.top_k;
      document.getElementById('hb-cfg-topp').textContent=c.top_p;
      document.getElementById('hb-cfg-rep').textContent=c.repetition_penalty;
      document.getElementById('hb-cfg-max').textContent=c.max_tokens;
      window._globalConfig=c;
    }
  }).catch(()=>{});
}
updateSystem();setInterval(updateSystem,3000);

// ── Palantír header badge ────────────────────────────────────────────────
let palList=[];
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function updatePalantir(list){
  palList=Array.isArray(list)?list:[];
  const el=document.getElementById('hb-palantir');
  const n=palList.length,m=palList.filter(w=>w.status==='alerting').length;
  if(n===0){el.className='c-subtext1';el.innerHTML='&#128302; —';}
  else{el.className=m>0?'c-red':'c-green';el.innerHTML='&#128302; '+n+(m>0?'·'+m+'▲':'');}
  if(document.getElementById('pal-pop').style.display==='block')renderPalPop();
}
function renderPalPop(){
  const pop=document.getElementById('pal-pop');
  // Build the static shell (list container + watch form) once, so the 3s poll
  // re-renders only the list and never wipes a half-typed path or steals focus.
  if(!pop._built){
    pop.innerHTML='<div id="pal-list"></div>'
      +'<div class="pal-row pal-form"><input id="pal-watch-path" type="text" placeholder="log file to watch…" spellcheck="false"><button id="pal-watch-go">watch</button></div>'
      +'<div id="pal-watch-err" class="pal-row c-red"></div>';
    pop._built=true;
  }
  document.getElementById('pal-list').innerHTML=palList.length?palList.map(w=>{
    const dot=w.status==='alerting'?'<span class="c-red">▲</span>':'<span class="c-green">●</span>';
    const msg=w.alert?('<div class="pal-msg c-subtext1">'+escapeHtml(w.alert)+'</div>'):'';
    return '<div class="pal-row">'+dot+' <b>'+escapeHtml(w.name)+'</b> <span class="c-subtext1">'+escapeHtml(w.status)+'</span>'
      +' <span class="pal-stop" data-name="'+escapeHtml(w.name)+'" title="stop watcher">&#10005;</span>'+msg+'</div>';
  }).join(''):'<div class="pal-row c-subtext1">no palantír watchers running</div>';
}
function palantirWatch(){
  const inp=document.getElementById('pal-watch-path'),errEl=document.getElementById('pal-watch-err');
  const path=(inp.value||'').trim();
  if(!path){errEl.textContent='enter a file path';return;}
  errEl.textContent='starting…';
  fetch('/api/palantir/watch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})})
    .then(r=>r.json()).then(d=>{if(d.ok){inp.value='';errEl.textContent='';updateSystem();}else{errEl.textContent=d.error||'failed';}})
    .catch(()=>{errEl.textContent='request failed';});
}
function palantirStop(name){
  fetch('/api/palantir/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})})
    .then(r=>r.json()).then(()=>updateSystem()).catch(()=>{});
}
document.getElementById('hb-palantir').addEventListener('click',e=>{
  e.stopPropagation();
  const pop=document.getElementById('pal-pop');
  const show=pop.style.display!=='block';
  pop.style.display=show?'block':'none';
  if(show)renderPalPop();
});
// Keep clicks/typing inside the popover from bubbling to the document handler
// that closes it; delegate the watch button and per-row stop ✕.
const _palPop=document.getElementById('pal-pop');
_palPop.addEventListener('click',e=>{
  e.stopPropagation();
  const stop=e.target.closest('.pal-stop');
  if(stop){palantirStop(stop.dataset.name);}
  else if(e.target.id==='pal-watch-go'){palantirWatch();}
});
_palPop.addEventListener('keydown',e=>{if(e.target.id==='pal-watch-path'&&e.key==='Enter'){e.preventDefault();palantirWatch();}});
document.addEventListener('click',()=>{document.getElementById('pal-pop').style.display='none';});

window._globalConfig={};

function tileConfig(id){
  const tile=tiles.find(t=>t.id===id);
  const tc=tile&&tile.el._config||{};
  const gc=window._globalConfig||{};
  return{
    temperature:tc.temperature!=null?tc.temperature:gc.temperature!=null?gc.temperature:0.4,
    top_k:tc.top_k!=null?tc.top_k:gc.top_k!=null?gc.top_k:40,
    top_p:tc.top_p!=null?tc.top_p:gc.top_p!=null?gc.top_p:0.9,
    repetition_penalty:tc.repetition_penalty!=null?tc.repetition_penalty:gc.repetition_penalty!=null?gc.repetition_penalty:1.05,
    max_tokens:tc.max_tokens!=null?tc.max_tokens:gc.max_tokens!=null?gc.max_tokens:512,
    recall_level:tc.recall_level!=null?tc.recall_level:gc.recall_level!=null?gc.recall_level:-1,
  };
}

function openCfg(){
  fetch('/api/config').then(r=>r.json()).then(c=>{
    window._globalConfig=c;
    const sel=document.getElementById('cfg-model');
    while(sel.firstChild)sel.removeChild(sel.firstChild);
    if(c.available_models){c.available_models.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sel.appendChild(o);})}
    sel.value=c.model||'';
    setSlider('cfg-temp',c.temperature);
    setSlider('cfg-topk',c.top_k);
    setSlider('cfg-topp',c.top_p);
    setSlider('cfg-rep',c.repetition_penalty);
    document.getElementById('cfg-max').value=c.max_tokens;
    document.getElementById('cfg-cloud-model').value=c.cloud_model||'';
    document.getElementById('cfg-cloud-max').value=c.cloud_max_tokens||4096;
    setSlider('cfg-recall',c.recall_level);
    document.getElementById('cfg-sysprompt').value=c.system_prompt||'';
    const scopeRow=document.getElementById('cfg-scope-row');
    scopeRow.style.display=focusedId!=null?'flex':'none';
    document.querySelector('input[name="cfg-scope"][value="global"]').checked=true;
    document.getElementById('cfg-overlay').classList.add('open');
  });
}

function closeCfg(){document.getElementById('cfg-overlay').classList.remove('open')}

function setSlider(id,val){
  document.getElementById(id).value=val;
  const r=document.getElementById(id+'-r');if(r)r.value=val;
}

document.querySelectorAll('.cfg-row input[type=range]').forEach(r=>{
  const numId=r.id.replace('-r','');
  r.addEventListener('input',()=>{document.getElementById(numId).value=r.value});
});
document.querySelectorAll('.cfg-row input[type=number]').forEach(n=>{
  const rId=n.id+'-r';
  n.addEventListener('input',()=>{const r=document.getElementById(rId);if(r)r.value=n.value});
});

function applyCfg(){
  const scope=document.querySelector('input[name="cfg-scope"]:checked').value;
  const cfg={
    model:document.getElementById('cfg-model').value,
    temperature:parseFloat(document.getElementById('cfg-temp').value),
    top_k:parseInt(document.getElementById('cfg-topk').value),
    top_p:parseFloat(document.getElementById('cfg-topp').value),
    repetition_penalty:parseFloat(document.getElementById('cfg-rep').value),
    max_tokens:parseInt(document.getElementById('cfg-max').value),
    cloud_model:document.getElementById('cfg-cloud-model').value,
    cloud_max_tokens:parseInt(document.getElementById('cfg-cloud-max').value),
    recall_level:parseInt(document.getElementById('cfg-recall').value),
    system_prompt:document.getElementById('cfg-sysprompt').value,
  };
  if(scope==='tile'&&focusedId!=null){
    const tile=tiles.find(t=>t.id===focusedId);
    if(tile)tile.el._config=cfg;
  }else{
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)})
      .then(r=>r.json()).then(d=>{
        if(d.model)document.getElementById('hb-model').textContent=d.model;
      }).catch(()=>{});
    window._globalConfig=cfg;
  }
  const apikey=document.getElementById('cfg-apikey').value;
  if(apikey){
    fetch('/api/config/apikey',{method:'POST',body:apikey});
    document.getElementById('cfg-apikey').value='';
  }
  closeCfg();
}

document.getElementById('olorin-btn').addEventListener('click',openCfg);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCfg()});

setInterval(()=>{const now=new Date();
  document.getElementById('hb-clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
},1000);
</script>
