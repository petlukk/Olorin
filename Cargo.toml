[package]
name = "olorin"
version = "3.17.7"
edition = "2021"

[[bin]]
name = "olorin"
path = "src/main.rs"

[lib]
name = "olorin"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
libloading = "0.8"

[dev-dependencies]
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
