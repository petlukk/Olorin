[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
# Reserve 16 MB main-thread stack. Windows defaults to 1 MB; the
# forward pass busts both 1 MB and 8 MB because the Win64 ABI's
# mandatory shadow space per call accumulates across 35 transformer
# layers. Reserve is virtual (no physical commit until used), so this
# is free until needed.
rustflags = ["-C", "link-arg=-Wl,--stack,16777216"]
